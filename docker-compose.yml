services:
  fpm:
    build: ./docker/fpm
    init: true
    working_dir: '/app'
    user: 1000:1000
    volumes:
      - './:/app'
      - ~/.composer:/.composer
    environment:
      COMPOSER_HOME: '/.composer'
    depends_on:
      - redis
  redis:
    image: redis:alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']

volumes:
  redis-data:
